server {
    listen 80;
    server_name _;

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://lodge-api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve everything under /management-dashboard from the dist output
    location /management-dashboard/ {
        alias /usr/share/nginx/html/management-dashboard/;
        try_files $uri $uri/ /management-dashboard/index.html;
        expires -1;
    }

    location /management-dashboard/assets/ {
        alias /usr/share/nginx/html/management-dashboard/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
