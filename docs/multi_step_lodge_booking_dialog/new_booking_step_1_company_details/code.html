<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#635546",
                        "tertiary-fixed-dim": "#d7c3b0",
                        "surface-container": "#f0eded",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f3f0f0",
                        "surface-container-highest": "#e4e2e1",
                        "tertiary-fixed": "#f4dfcb",
                        "on-surface": "#1b1c1c",
                        "surface-variant": "#e4e2e1",
                        "primary": "#8a451c",
                        "outline": "#87736a",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#241a0e",
                        "secondary": "#605e5b",
                        "on-primary-fixed-variant": "#74340c",
                        "background": "#fbf9f8",
                        "on-surface-variant": "#54433b",
                        "surface": "#fbf9f8",
                        "on-secondary-fixed-variant": "#484743",
                        "on-background": "#1b1c1c",
                        "primary-fixed-dim": "#ffb691",
                        "surface-container-low": "#f6f3f2",
                        "error": "#ba1a1a",
                        "surface-dim": "#dcd9d9",
                        "outline-variant": "#dac2b7",
                        "secondary-container": "#e6e2dd",
                        "surface-container-high": "#eae8e7",
                        "secondary-fixed": "#e6e2dd",
                        "inverse-primary": "#ffb691",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#1c1c19",
                        "on-tertiary-fixed-variant": "#524436",
                        "primary-container": "#a85c32",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#fff2e8",
                        "primary-fixed": "#ffdbcb",
                        "surface-bright": "#fbf9f8",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#c9c6c1",
                        "inverse-surface": "#303030",
                        "on-secondary-container": "#666460",
                        "tertiary-container": "#7d6d5d",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#341100",
                        "surface-tint": "#924b22",
                        "on-primary-container": "#fff3ee",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "label-sm": ["Manrope"],
                        "label-md": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "headline-md": ["Manrope"]
                    },
                    "fontSize": {
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "18px", "fontWeight": "600"}],
                        "headline-lg": ["30px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopNavBar Shell -->
<header class="bg-[#FDFCFB] dark:bg-stone-950 shadow-sm border-b border-stone-200 dark:border-stone-800 flex justify-between items-center w-full px-6 h-16 fixed top-0 z-50">
<div class="flex items-center gap-8">
<span class="text-xl font-bold tracking-tight text-stone-900 dark:text-stone-50">LodgePro</span>
<nav class="hidden md:flex gap-6">
<a class="text-stone-500 dark:text-stone-400 font-manrope text-sm font-medium hover:bg-stone-100 dark:hover:bg-stone-900 transition-colors px-2 py-1 rounded" href="#">Dashboard</a>
<a class="text-[#A85C32] border-b-2 border-[#A85C32] pb-1 font-manrope text-sm font-medium" href="#">Bookings</a>
<a class="text-stone-500 dark:text-stone-400 font-manrope text-sm font-medium hover:bg-stone-100 dark:hover:bg-stone-900 transition-colors px-2 py-1 rounded" href="#">Inventory</a>
</nav>
</div>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-stone-100 dark:hover:bg-stone-900 transition-colors text-stone-500">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="p-2 rounded-full hover:bg-stone-100 dark:hover:bg-stone-900 transition-colors text-stone-500">
<span class="material-symbols-outlined">settings</span>
</button>
<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center overflow-hidden border border-outline-variant">
<img alt="Manager profile" data-alt="A professional headshot of a boutique hotel manager in a stylishly lit, rustic lobby. The warm terracotta and soft cream tones of the environment reflect the brand's aesthetic. Soft ambient lighting highlights the professional and welcoming atmosphere of a high-end lodge setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAiAl6yCpct8kg7XVEH_U6dk3JEa7XAqo-TBAoEWphoQPJ9idSpojhnZec1ke4fr7Q_LKDG_tRAXo3SAYkNDJ5tmm525pUOzIz98I2U5AsJtZBhPuZINZF_b9rJMJmcI6M99xlukK3YiqNWU3xGV8NdMtxjcjgkdP6wn6xATSMxecCMyHZ2TJzEK1xs2ZClAC7DdiAO3u17lsxpptsUBmeIEq4j5oiyX8f7LNz-38urw58YArMogJO--UenYFGnn964oywR7SBOtw8"/>
</div>
</div>
</header>
<main class="flex-grow pt-16 flex items-center justify-center bg-surface-dim/20 px-4">
<!-- Dialog Container -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
<!-- Stepper Header -->
<div class="px-8 pt-8 pb-6 bg-surface-container-low border-b border-outline-variant">
<h1 class="font-headline-md text-on-surface mb-6">New Booking</h1>
<div class="flex items-center justify-between relative">
<div class="absolute top-1/2 left-0 w-full h-[2px] bg-outline-variant -z-0"></div>
<!-- Step 1 (Active) -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-lg shadow-md ring-4 ring-surface-container-lowest">1</div>
<span class="font-label-md text-primary-container">Company Details</span>
</div>
<!-- Step 2 (Inactive) -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-bold text-lg ring-4 ring-surface-container-lowest">2</div>
<span class="font-label-md text-on-surface-variant">Room &amp; Guests</span>
</div>
<!-- Step 3 (Inactive) -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-bold text-lg ring-4 ring-surface-container-lowest">3</div>
<span class="font-label-md text-on-surface-variant">Confirmation</span>
</div>
</div>
</div>
<!-- Form Content -->
<div class="p-8 space-y-stack-lg">
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Client Type (Segmented Control) -->
<div class="col-span-full space-y-stack-sm">
<label class="font-label-md text-on-surface-variant">Client Type</label>
<div class="flex p-1 bg-surface-container-low border border-outline-variant rounded-lg">
<button class="flex-1 py-2 px-4 rounded-md font-label-md transition-all duration-200 text-on-surface-variant hover:bg-surface-container">Individual</button>
<button class="flex-1 py-2 px-4 rounded-md font-label-md bg-primary-container text-on-primary-container shadow-sm">Corporate</button>
</div>
</div>
<!-- Company Selection -->
<div class="space-y-stack-sm">
<label class="font-label-md text-on-surface-variant" for="company">Company</label>
<div class="relative">
<select class="w-full h-11 px-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none appearance-none font-body-md text-on-surface" id="company">
<option>Highland Tech Solutions</option>
<option>Summit Logistics Group</option>
<option>Valley Consulting Co.</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Room Selection -->
<div class="space-y-stack-sm">
<label class="font-label-md text-on-surface-variant" for="room">Preferred Room</label>
<div class="relative">
<select class="w-full h-11 px-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none appearance-none font-body-md text-on-surface" id="room">
<option>Heritage Suite - Room 104</option>
<option>Pine View Cabin - Room 02</option>
<option>Mountain Lookout - Room 301</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">bed</span>
</div>
</div>
<!-- Dates -->
<div class="space-y-stack-sm">
<label class="font-label-md text-on-surface-variant" for="check-in">Check-In</label>
<div class="relative">
<input class="w-full h-11 px-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none font-body-md text-on-surface" id="check-in" type="date" value="2023-11-15"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-size: 20px;">calendar_today</span>
</div>
</div>
<div class="space-y-stack-sm">
<label class="font-label-md text-on-surface-variant" for="check-out">Check-Out</label>
<div class="relative">
<input class="w-full h-11 px-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none font-body-md text-on-surface" id="check-out" type="date" value="2023-11-20"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-size: 20px;">calendar_today</span>
</div>
</div>
<!-- Number of Guests -->
<div class="space-y-stack-sm">
<label class="font-label-md text-on-surface-variant" for="guests">Number of Guests</label>
<div class="flex items-center border border-outline-variant rounded-lg bg-surface-container-lowest overflow-hidden h-11">
<button class="px-4 h-full hover:bg-surface-container transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-lg">remove</span>
</button>
<input class="flex-grow text-center border-none focus:ring-0 font-body-md text-on-surface" id="guests" type="text" value="2"/>
<button class="px-4 h-full hover:bg-surface-container transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-lg">add</span>
</button>
</div>
</div>
<!-- Special Requests -->
<div class="col-span-full space-y-stack-sm">
<label class="font-label-md text-on-surface-variant" for="requests">Special Requests</label>
<textarea class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none font-body-md text-on-surface resize-none" id="requests" placeholder="Enter any dietary requirements or accessibility needs..." rows="3"></textarea>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-8 py-6 bg-surface-container-low border-t border-outline-variant flex items-center justify-between">
<button class="px-6 py-2.5 rounded-lg border border-outline text-on-surface font-label-md hover:bg-surface-container-high active:scale-95 transition-all duration-150">
                    Cancel
                </button>
<div class="flex gap-4">
<button class="px-8 py-2.5 rounded-lg bg-primary-container text-on-primary-container font-label-md shadow-lg shadow-primary-container/20 hover:bg-primary-container/90 active:scale-95 transition-all duration-150 flex items-center gap-2">
                        Next
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
<!-- Side Illustration Decor (Background) -->
<div class="fixed top-0 right-0 w-1/3 h-screen -z-10 bg-gradient-to-l from-primary-fixed/30 to-transparent"></div>
<div class="fixed bottom-0 left-0 w-1/4 h-64 -z-10 overflow-hidden opacity-40">
<img alt="Background Texture" class="object-cover w-full h-full grayscale mix-blend-multiply" data-alt="A serene landscape of a mountain lodge at dusk, featuring warm interior lights glowing through large windows against a deep indigo and terracotta sunset sky. The scene is shot with a shallow depth of field, highlighting the rustic wooden textures of the lodge exterior. The overall mood is peaceful, sophisticated, and perfectly aligned with a high-end hospitality aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHRzCDWPmygcxTTw-6htIope73FunbGMc9nRVuAmRa4jN9RGXKLThW-cCSaYOXF-T85jsv3zKhEghy0sbwbMz1rqpAmEXxE_8GjFLvM3uG3zcbvtkQMQNQtk5DtOMX1b4KXYrrAqn7bSQtgUPTlekdgC302YTdCt9O-UdOKyxIHXOMqDcAOWbyMyotQLQ8iRARm-QFIJvEapBEEDEQesmsc_mx7b-LV0UKfYAy42x1gkdZk0DTr86TPkkwMpwzftvuolElSB0amv0"/>
</div>
</body></html>
